name: EAML-PT Governance Assertions Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências de Conformidade
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Executar Validação Estática de Políticas (Policy Checker)
      run: |
        python policy_checker.py

    - name: Executar Testes de Contrato do Gateway
      run: |
        python tests/contract/test_oversight_gateway_contract.py

    - name: Executar Testes de Integração End-to-End (SLA < 100ms)
      run: |
        python tests/integration/test_system_flow.py
        

    - name: Executar Testes do Orquestrador de Confiança (Fail-Closed & Zeroization)
      run: |
        python tests/integration/test_trust_orchestrator.py


    - name: Simulação de Red Teaming HNDL (PQC Resilience)
      run: |
        python tests/security/simulate_hndl_interception.py

    - name: Validação de Fast Track Approved & Zero-Storage
      run: |
        echo "Atestação de Governação bem-sucedida: Todos os portões de conformidade (AI Act, eIDAS 2.0, NIS2) validados."
        echo "ESTADO DO BUILD: FAST TRACK APPROVED"
